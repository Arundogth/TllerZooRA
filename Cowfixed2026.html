
<!DOCTYPE html>
<html>
<head>
    <title>Taller RX: Visualización Anatómica</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.12.0/model-viewer.min.js"></script>

    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Botón AR: posición ajustada */
        #custom-ar-button {
            background-color: #28a745;
            color: white;
            font-size: 17px;
            font-weight: bold;
            padding: 15px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;

            position: absolute;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);

            width: calc(100% - 30px);
            max-width: 420px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
            transition: background-color 0.2s;
        }

        #custom-ar-button:active {
            background-color: #1e7e34;
        }

        /* Ajuste para teléfonos en horizontal */
        @media screen and (orientation: landscape) {
            #custom-ar-button {
                bottom: 20px;
                width: auto;
                max-width: 75%;
                font-size: 15px;
                padding: 10px 18px;
            }
        }
    </style>
</head>

<body>

    <model-viewer
        src="https://arundogth.github.io/TllerZooRA/cow2k.glb"
        alt="Modelo Anatómico para Zootecnia"
        loading="eager"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y">

        <button slot="ar-button" id="custom-ar-button">
            TOCA AQUÍ PARA INICIAR REALIDAD AUMENTADA
        </button>

    </model-viewer>

</body>
</html>
