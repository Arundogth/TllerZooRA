
<!DOCTYPE html>
<html>
<head>
    <title>Taller RX: Visualización Anatómica</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.12.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: block;
        }

        #custom-ar-button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.3;

            padding: 14px 18px;
            min-height: 60px;
            width: calc(100vw - 28px);
            max-width: 420px;

            border: none;
            border-radius: 12px;
            cursor: pointer;

            position: absolute;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);

            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;

            -webkit-tap-highlight-color: transparent;
        }

        #custom-ar-button:active {
            background-color: #1e7e34;
        }

        /* Ajuste para teléfonos en posición horizontal */
        @media (orientation: landscape) and (max-height: 500px) {
            #custom-ar-button {
                bottom: 8px;
                min-height: 46px;
                padding: 9px 14px;
                font-size: 14px;
                max-width: 75vw;
            }
        }
    </style>
</head>

<body>

    <model-viewer
        src="https://arundogth.github.io/TllerZooRA/cow2k.glb"
        alt="Modelo Anatómico para Zootecnia"
        loading="eager"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y">

        <button slot="ar-button" id="custom-ar-button">
            TOCA AQUÍ PARA INICIAR REALIDAD AUMENTADA
        </button>

    </model-viewer>

</body>
</html>
