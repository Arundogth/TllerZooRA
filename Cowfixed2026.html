
<!DOCTYPE html>
<html>
<head>
    <title>Taller RX: Visualización Anatómica</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.12.0/model-viewer.min.js"></script>

    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
        }

        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden;
        }

        #custom-ar-button {
            background-color: #28a745;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
            transition: background-color 0.2s;
        }

        #custom-ar-button:active {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <model-viewer
        src="https://arundogth.github.io/TllerZooRA/cow2k.glb"
        alt="Modelo Anatómico para Zootecnia"
        loading="eager"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        touch-action="pan-y">

        <button slot="ar-button" id="custom-ar-button">
            TOCA AQUÍ PARA INICIAR REALIDAD AUMENTADA
        </button>
        
    </model-viewer>

</body>
</html>
