<!DOCTYPE html>
<html>
<head>
    <title>Taller RX: Visualización Anatómica</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/1.12.0/model-viewer.min.js"></script>

    <style>
        /* Estilos generales */
        model-viewer {
            width: 100vw;
            height: 100vh;
        }
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden;
        }
        
        /* Opcional: Estilo nativo para hacerlo un poco más grande y visible */
        model-viewer {
            --ar-button-background-color: #007bff; /* Color azul */
            --ar-button-border-radius: 10px;
            --ar-button-font-size: 16px;
            --ar-button-padding: 10px 20px;
        }
    </style>
</head>
<body>

    <model-viewer
        /* REPOSICIONAMIENTO DEL BOTÓN NATIVO MEDIANTE VARIABLES CSS INTERNAS */
        style="
            --ar-button-right: 50%;
            --ar-button-bottom: 100px; /* ELEVADO A 100 PÍXELES DE LA BASE */
            --ar-button-transform: translateX(-50%);
        "

        /* FUENTES Y FUNCIONALIDAD */
        src="https://arundogth.github.io/TllerZooRA/horse_skeleton.glb"
        ios-src="https://arundogth.github.io/TllerZooRA/horse_skeleton.usdz" 
        
        alt="Modelo Anatómico para Zootecnia"
        loading="eager"
        autoplay
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        camera-controls
        touch-action="pan-y">
        
        </model-viewer>

</body>
</html>
